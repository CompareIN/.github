name: Task
description: A specific piece of work, such as a fix, a refactor, or a data change.
type: Task
projects: ["CompareIN/4"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed. Links, screenshots.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
