name: Epic
description: A big piece of work that is broken into smaller stories.
type: Epic
projects: ["CompareIN/4"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this epic delivers, and why.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The main parts of the work. After you create the epic, add each story as a sub-issue.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
