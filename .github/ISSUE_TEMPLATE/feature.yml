name: Feature
description: A request, idea, or new functionality, written as a user story.
type: Feature
projects: ["CompareIN/4"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <role>, I want <goal>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links, screenshots.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] An agent can ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
