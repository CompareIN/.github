name: Specification
description: A detailed description of how a feature or change must work, before it is built.
type: Specification
projects: ["CompareIN/4"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this specification covers, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The problem, and why it must be solved now.
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Business rules, calculations, screens, data.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: questions
    attributes:
      label: Open questions
